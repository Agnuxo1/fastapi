name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to validate and publish
        required: true
        default: v2.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pytest
          python -m compileall -q app scripts tests
          python -m scripts.benchmark

      - name: Build reproducible source archives
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="fastapi-deployment-starter-${TAG#v}/" "$TAG" -o "dist/fastapi-deployment-starter-${TAG#v}.tar.gz"
          git archive --format=zip --prefix="fastapi-deployment-starter-${TAG#v}/" "$TAG" -o "dist/fastapi-deployment-starter-${TAG#v}.zip"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/* --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --title "FastAPI Deployment Starter ${TAG}" \
            --generate-notes
